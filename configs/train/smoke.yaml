# 5-minute CPU/GPU smoke test — §4 DoD: Kaggle notebook trains 12M on TinyStories unedited.
model_config: configs/model/12m_proxy.yaml
tokens_per_step: 8192
micro_batch_size: 4
seq_len: 256
max_tokens: 2_000_000
peak_lr: 3.0e-3
min_lr_ratio: 0.1
schedule: wsd
warmup_frac: 0.02
stable_frac: 0.80
decay_frac: 0.18
optimizer: adamw
betas: [0.9, 0.95]
weight_decay: 0.1
grad_clip: 1.0
precision: fp32              # CPU smoke: no GradScaler
z_loss: 1.0e-4
torch_compile: off
ckpt_every_min: 5
seed: 1337
