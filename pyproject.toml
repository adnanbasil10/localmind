[project]
name = "localmind"
version = "0.1.0"
description = "A 31M-param LM built from scratch, serving as the CPU-resident control plane of an agentic RAG system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "regex>=2024.5.15",
  "tqdm>=4.66",
  "rich>=13.7",
]

[project.optional-dependencies]
# Phases 2-6: model, training, inference. Torch is CPU-only by default here.
torch = ["torch>=2.4", "safetensors>=0.4.3"]
# Phase 1 benchmark comparators
tok = ["tiktoken>=0.7", "sentencepiece>=0.2", "tokenizers>=0.19"]
# Phase 3 data pipeline
data = ["datasets>=2.20", "datasketch>=1.6", "zstandard>=0.22"]
# Phases 7-9: ingestion, retrieval, agent
rag = [
  "fastapi>=0.111", "uvicorn[standard]>=0.30", "httpx>=0.27",
  "bm25s>=0.2", "scipy>=1.13", "redis>=5.0", "psycopg[binary]>=3.1",
  "pgvector>=0.3", "duckduckgo-search>=6.1",
]
# Phase 11 observability
obs = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp>=1.25", "prometheus-client>=0.20"]
dev = [
  "pytest>=8.2", "pytest-cov>=5.0", "hypothesis>=6.103",
  "ruff>=0.5", "pyright>=1.1.370", "locust>=2.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["localmind"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["localmind", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "NPY"]
ignore = ["E501", "B008", "N806", "N803", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pyright]
include = ["localmind"]
exclude = ["**/__pycache__", ".venv", "notebooks"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: takes more than ~10s",
  "gpu: requires CUDA",
  "net: requires network access",
  "docker: requires docker compose services",
]
filterwarnings = ["ignore::DeprecationWarning"]
